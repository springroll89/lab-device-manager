<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 260" width="960" height="260" role="img" aria-label="Lab Device Manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1218"/>
      <stop offset="0.55" stop-color="#05090d"/>
      <stop offset="1" stop-color="#081017"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ce3bf"/>
      <stop offset="1" stop-color="#58d6aa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7ce3bf" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#7ce3bf" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#152229" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="960" height="260" fill="url(#bg)"/>
  <rect width="960" height="260" fill="url(#grid)" opacity="0.55"/>
  <ellipse cx="360" cy="130" rx="360" ry="120" fill="url(#glow)"/>
  <rect x="0" y="0" width="5" height="260" fill="url(#teal)"/>

  <!-- LIVE pill (top-right) -->
  <g transform="translate(828,30)">
    <rect width="92" height="26" rx="13" fill="#0e171e" stroke="#1d3b33" stroke-width="1"/>
    <circle cx="18" cy="13" r="4" fill="#7ce3bf"/>
    <circle cx="18" cy="13" r="4" fill="#7ce3bf" opacity="0.5"/>
    <text x="30" y="18" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#7ce3bf" letter-spacing="1.5">LIVE</text>
  </g>

  <!-- sensor / equalizer motif (right) -->
  <g transform="translate(736,104)">
    <rect x="0"   y="30" width="12" height="40" rx="3" fill="#7ce3bf" opacity="0.80"/>
    <rect x="22"  y="0"  width="12" height="70" rx="3" fill="#58d6aa" opacity="0.92"/>
    <rect x="44"  y="20" width="12" height="50" rx="3" fill="#7ce3bf" opacity="0.70"/>
    <rect x="66"  y="8"  width="12" height="62" rx="3" fill="#58d6aa" opacity="0.85"/>
    <rect x="88"  y="24" width="12" height="46" rx="3" fill="#7ce3bf" opacity="0.72"/>
    <rect x="110" y="2"  width="12" height="68" rx="3" fill="#58d6aa" opacity="0.90"/>
    <rect x="132" y="18" width="12" height="52" rx="3" fill="#7ce3bf" opacity="0.78"/>
  </g>

  <!-- title -->
  <text x="60" y="128" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="50" font-weight="700" fill="#f1f4f5" letter-spacing="0.5">Lab Device Manager</text>
  <rect x="62" y="146" width="132" height="4" rx="2" fill="url(#teal)"/>
  <text x="60" y="186" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="20" font-weight="500" fill="#9fb0bd">SCADA + LIMS for the wet-chemistry lab · read-only first</text>
  <text x="60" y="222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#7ce3bf" letter-spacing="3">PURiCORE  ·  CERAMIC MEMBRANE R&amp;D</text>
</svg>
