<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" role="img" aria-label="Lab Device Manager 架构">
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1218"/>
      <stop offset="1" stop-color="#05090d"/>
    </linearGradient>
    <linearGradient id="teal2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ce3bf"/>
      <stop offset="1" stop-color="#58d6aa"/>
    </linearGradient>
    <pattern id="grid2" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#152229" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="420" fill="url(#bg2)"/>
  <rect width="900" height="420" fill="url(#grid2)" opacity="0.5"/>
  <rect x="0" y="0" width="5" height="420" fill="url(#teal2)"/>

  <!-- Band 1: 设备层 -->
  <g>
    <rect x="30" y="20" width="840" height="80" rx="10" fill="#0e171e" stroke="#1d3b33"/>
    <rect x="30" y="20" width="4" height="80" rx="2" fill="url(#teal2)"/>
    <rect x="50" y="55" width="11" height="11" rx="2" fill="#7ce3bf"/>
    <text x="72" y="58" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#f1f4f5">设备层</text>
    <text x="72" y="78" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#7ce3bf" letter-spacing="1">RS485 / RS232</text>
    <text x="270" y="66" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif" font-size="14" fill="#c5d0d8">注射泵 TYD02<tspan fill="#58d6aa">   ·   </tspan>搅拌器 HMS-C ×5<tspan fill="#58d6aa">   ·   </tspan>粘度计 方瑞<tspan fill="#58d6aa">   ·   </tspan>温湿度 WHD46-33</text>
  </g>
  <path d="M53 105 L47 113 L59 113 Z" fill="#7ce3bf"/>

  <!-- Band 2: 采集层 -->
  <g>
    <rect x="30" y="120" width="840" height="80" rx="10" fill="#0e171e" stroke="#1d3b33"/>
    <rect x="30" y="120" width="4" height="80" rx="2" fill="url(#teal2)"/>
    <rect x="50" y="155" width="11" height="11" rx="2" fill="#7ce3bf"/>
    <text x="72" y="158" font-family="Segoe UI, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#f1f4f5">采集层</text>
    <text x="72" y="178" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#7ce3bf" letter-spacing="1">ACQUISITION · READ-ONLY</text>
    <text x="270" y="166" font-family="Segoe UI, Helvetica, sans-serif" font-size="14" fill="#c5d0d8">InstrumentAdapter<tspan fill="#58d6aa">   ·   </tspan>Sampler<tspan fill="#58d6aa">   ·   </tspan>Engine（连接生命周期）</text>
  </g>
  <path d="M53 205 L47 213 L59 213 Z" fill="#7ce3bf"/>

  <!-- Band 3: 业务层 -->
  <g>
    <rect x="30" y="220" width="840" height="80" rx="10" fill="#0e171e" stroke="#1d3b33"/>
    <rect x="30" y="220" width="4" height="80" rx="2" fill="url(#teal2)"/>
    <rect x="50" y="255" width="11" height="11" rx="2" fill="#7ce3bf"/>
    <text x="72" y="258" font-family="Segoe UI, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#f1f4f5">业务层</text>
    <text x="72" y="278" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#7ce3bf" letter-spacing="1">BUSINESS · SQLITE</text>
    <text x="270" y="266" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14" fill="#c5d0d8">运行检测<tspan fill="#58d6aa">   ·   </tspan>R-201 状态机<tspan fill="#58d6aa">   ·   </tspan>实物追溯<tspan fill="#58d6aa">   ·   </tspan>统一库存<tspan fill="#58d6aa">   ·   </tspan>账号 / 审计</text>
  </g>
  <path d="M53 305 L47 313 L59 313 Z" fill="#7ce3bf"/>

  <!-- Band 4: Web UI -->
  <g>
    <rect x="30" y="320" width="840" height="80" rx="10" fill="#0e171e" stroke="#1d3b33"/>
    <rect x="30" y="320" width="4" height="80" rx="2" fill="url(#teal2)"/>
    <rect x="50" y="355" width="11" height="11" rx="2" fill="#7ce3bf"/>
    <text x="72" y="358" font-family="Segoe UI, PingFang SC, sans-serif" font-size="17" font-weight="700" fill="#f1f4f5">Web UI</text>
    <text x="72" y="378" font-family="Segoe UI, Helvetica, sans-serif" font-size="11" font-weight="600" fill="#7ce3bf" letter-spacing="1">LAN · 0.0.0.0:7800</text>
    <text x="270" y="366" font-family="Segoe UI, PingFang SC, sans-serif" font-size="14" fill="#c5d0d8">设备看板<tspan fill="#58d6aa">   ·   </tspan>平板执行台<tspan fill="#58d6aa">   ·   </tspan>粘度工位<tspan fill="#58d6aa">   ·   </tspan>库存 /inventory<tspan fill="#58d6aa">   ·   </tspan>导出 PDF / Excel</text>
  </g>
</svg>
