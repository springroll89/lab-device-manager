<!doctype html>
<html lang="zh">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="icon" href="data:,"><title>登录 · 设备采集管理台</title>
<style>
 *{box-sizing:border-box}
 html,body{margin:0;padding:0;height:100%;font-family:-apple-system,"PingFang SC",sans-serif}
 .wrap{display:flex;height:100vh;width:100vw;overflow:hidden}
 .left{
   flex:1.2;
   background:#000;
   display:flex;align-items:center;justify-content:center;
   position:relative;
 }
 .left::before{
   content:"";
   position:absolute;inset:0;
   background:radial-gradient(circle at 30% 50%, rgba(110,168,255,0.12) 0%, transparent 55%);
 }
 .left img{
   position:relative;
   max-width:72%;max-height:72%;
   object-fit:contain;
   filter:drop-shadow(0 0 40px rgba(110,168,255,0.25));
 }
 .right{
   flex:1;
   background:#0f1115;
   display:flex;align-items:center;justify-content:center;
   padding:40px;
 }
 .card{
   width:100%;max-width:380px;
   background:#1a1d24;border-radius:16px;
   padding:36px 32px;
   box-shadow:0 20px 60px rgba(0,0,0,0.45);
   border:1px solid rgba(255,255,255,0.06);
 }
 .card .logo-small{
   height:42px;width:auto;margin-bottom:18px;
 }
 .card h1{
   margin:0 0 6px;font-size:22px;font-weight:600;color:#f0f2f5;letter-spacing:0.3px;
 }
 .card p{
   margin:0 0 26px;font-size:13px;color:#8a93a3;
 }
 .field{margin-bottom:18px}
 .field label{display:block;font-size:12px;color:#8a93a3;margin-bottom:6px}
 .field input{
   width:100%;
   background:#0f1115;border:1px solid #333;border-radius:8px;
   padding:11px 12px;color:#e6e6e6;font-size:14px;
   outline:none;transition:border-color .15s;
 }
 .field input:focus{border-color:#6ea8ff}
 .error{
   display:none;
   background:rgba(255,92,92,0.1);color:#ff5c5c;
   border:1px solid rgba(255,92,92,0.25);border-radius:8px;
   padding:10px 12px;font-size:13px;margin-bottom:18px;
 }
 .btn{
   width:100%;
   background:#6ea8ff;color:#0f1115;border:none;border-radius:8px;
   padding:12px;font-size:15px;font-weight:600;cursor:pointer;
   transition:background .15s, transform .12s;
 }
 .btn:hover{background:#9ec5ff}
 .btn:active{transform:scale(0.99)}
 .hint{
   margin-top:18px;text-align:center;font-size:12px;color:#555;
 }
 @media (max-width:860px){
   .left{display:none}
   .right{flex:none;width:100%}
 }
</style>
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="/static/puricore-theme.css">
</head>
<body class="page-login">
<div class="wrap">
  <div class="left">
    <img src="/static/logo.png" alt="Puricore">
  </div>
  <div class="right">
    <form id="loginForm" class="card" novalidate>
      <img src="/static/logo.png" alt="Puricore" class="logo-small">
      <h1>实验室登录</h1>
      <p id="loginIntro">请输入管理员分配的账号和密码。</p>
      <div id="loginStatus" class="login-status hidden" role="status" aria-live="polite"></div>
      <div class="field">
        <label for="username">账号</label>
        <input type="text" id="username" placeholder="请输入账号" autocomplete="username" autofocus required>
      </div>
      <div class="field">
        <label for="password">密码</label>
        <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password" required>
      </div>
      <button id="loginButton" type="submit" class="btn">登录</button>
      <div class="hint">登录账号会自动写入批次操作员和审计记录。</div>
    </form>
  </div>
</div>
<script>
function setLoginStatus(message, type = "error") {
  const status = document.getElementById("loginStatus");
  status.textContent = message;
  status.className = `login-status ${type}`;
}

function clearLoginStatus() {
  const status = document.getElementById("loginStatus");
  status.textContent = "";
  status.className = "login-status hidden";
}

function safeNextPath() {
  const requested = new URLSearchParams(location.search).get("next");
  if (requested && requested.startsWith("/") && !requested.startsWith("//")) {
    return requested;
  }
  return "/experiments";
}

async function loadAuthMode() {
  const intro = document.getElementById("loginIntro");
  try {
    const response = await fetch("/api/auth-mode");
    if (!response.ok) throw new Error();
    await response.json();
    intro.textContent = "请输入管理员分配的账号和密码。";
  } catch (_) {
    intro.textContent = "暂时无法连接登录服务。";
    setLoginStatus("登录服务连接失败，请刷新页面后重试。");
  }
}

async function doLogin(event) {
  event.preventDefault();
  const username = document.getElementById("username").value.trim();
  const pwd = document.getElementById("password").value;
  const button = document.getElementById("loginButton");
  clearLoginStatus();
  if (!username) {
    setLoginStatus("请输入账号。");
    document.getElementById("username").focus();
    return;
  }
  if (!pwd) {
    setLoginStatus("请输入密码。");
    document.getElementById("password").focus();
    return;
  }
  button.disabled = true;
  button.textContent = "正在登录…";
  try {
    const r = await fetch("/login", {
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({username, password: pwd})
    });
    const data = await r.json().catch(() => ({}));
    if (r.ok) {
      setLoginStatus(`登录成功，当前用户：${data.operator || username}`, "success");
      const nextPath = safeNextPath();
      window.location.replace(data.must_change_password
        ? `/change-password?next=${encodeURIComponent(nextPath)}`
        : nextPath);
    } else {
      const message = data.error === "credentials_required"
        ? "请输入账号和密码。"
        : data.error === "too_many_attempts"
          ? "登录失败次数过多，请 5 分钟后再试。"
          : data.error === "invalid_credentials"
            ? "账号或密码不正确。"
            : "登录失败，请重试。";
      setLoginStatus(message);
    }
  } catch (e) {
    setLoginStatus("网络连接失败，请检查本地服务后重试。");
  } finally {
    button.disabled = false;
    button.textContent = "登录";
  }
}

document.getElementById("loginForm").addEventListener("submit", doLogin);
loadAuthMode();
</script>
</body></html>
