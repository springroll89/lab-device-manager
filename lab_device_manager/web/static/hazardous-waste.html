<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>危废管理</title>
  <link rel="stylesheet" href="/static/puricore-theme.css">
  <style>
    body{margin:0}.waste-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 28px;border-bottom:1px solid var(--pc-line-soft);background:#070d12;position:sticky;top:0;z-index:20}.waste-header>div,.toolbar,.inline,.dialog-actions{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
    main{width:min(1180px,100%);margin:auto;padding:24px 18px 70px}.eyebrow{margin:0 0 4px;color:#ffc66d;font-size:11px;letter-spacing:.16em}.page-title{margin:0;font-size:clamp(26px,4vw,40px)}.muted{color:var(--pc-muted);font-size:12px}.panel{margin-top:18px;padding:18px;border:1px solid var(--pc-line-soft);border-radius:15px;background:var(--pc-surface)}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.panel h2{margin:0;font-size:17px}
    .btn{min-height:42px;padding:9px 14px;border:1px solid var(--pc-line);border-radius:10px;background:var(--pc-surface-2);color:var(--pc-text);text-decoration:none;cursor:pointer}.btn.primary{border-color:transparent;background:var(--pc-accent);color:#06130f;font-weight:750}.btn.danger{border-color:#714040;color:#ffaaaa}.btn.small{min-height:34px;padding:6px 10px;font-size:12px}.status{min-height:24px;color:var(--pc-accent)}.status.error{color:#ff9e9e}
    .waste-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.waste-card{padding:15px;border:1px solid var(--pc-line);border-radius:13px;background:#081117;cursor:pointer}.waste-card:hover{border-color:var(--pc-accent)}.waste-card h3{margin:0 0 8px}.badge{display:inline-flex;padding:3px 8px;border:1px solid var(--pc-line);border-radius:999px;font-size:11px}.badge.ready_for_transfer{color:#ffc66d}.badge.transferred{color:var(--pc-accent)}
    dialog{width:min(780px,calc(100% - 24px));max-height:90vh;overflow:auto;padding:20px;border:1px solid var(--pc-line);border-radius:16px;background:#0c151c;color:var(--pc-text)}dialog::backdrop{background:rgba(0,0,0,.72)}.dialog-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.dialog-head h2{margin:0}.form-grid,.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field label,.field>span{color:var(--pc-muted);font-size:12px}.full{grid-column:1/-1}input,select,textarea{width:100%;min-height:42px;padding:9px 11px;border:1px solid var(--pc-line);border-radius:9px;background:#070e13;color:var(--pc-text)}textarea{min-height:78px}.checks{display:flex;gap:8px;flex-wrap:wrap}.checks label{display:flex;align-items:center;gap:5px;padding:7px 9px;border:1px solid var(--pc-line);border-radius:8px}.checks input{width:auto;min-height:auto}.detail-value{padding:10px;border:1px solid var(--pc-line-soft);border-radius:9px}.detail-value span{display:block;color:var(--pc-muted);font-size:11px}.event{padding:9px 0;border-bottom:1px solid var(--pc-line-soft)}
    @media(max-width:820px){.waste-grid{grid-template-columns:1fr 1fr}.waste-header{padding:12px 14px;align-items:flex-start}.waste-header>strong{display:none}}
    @media(max-width:560px){.waste-grid,.form-grid,.detail-grid{grid-template-columns:1fr}.full{grid-column:auto}main{padding:18px 12px 70px}}
  </style>
</head>
<body>
  <header class="waste-header">
    <strong>Puricore · 危废管理</strong>
    <div><nav data-primary-nav></nav><span data-account-menu></span></div>
  </header>
  <main>
    <p class="eyebrow">HAZARDOUS WASTE</p>
    <h1 class="page-title">危废容器与转移联单</h1>
    <p class="muted">本页记录实验室内部危废台账；实际转移必须先在国家危险废物信息系统运行电子联单，本系统只登记国家系统编号和处置凭证。</p>
    <div class="toolbar">
      <button id="openWasteForm" class="btn primary" type="button">新建危废容器</button>
      <select id="wasteStatusFilter" class="btn"><option value="">全部状态</option><option value="accumulating">收集中</option><option value="ready_for_transfer">已封口待转移</option><option value="transferred">已转移</option></select>
      <button id="refreshWaste" class="btn" type="button">刷新</button>
      <a id="exportWasteLedger" class="btn" href="/api/inventory/hazardous-waste.csv">导出危废台账</a>
      <span id="wasteStatus" class="status"></span>
    </div>
    <section class="panel">
      <div class="panel-head"><h2>危废台账</h2><span id="wasteCount" class="muted"></span></div>
      <div id="wasteRows" class="waste-grid"></div>
    </section>
  </main>

  <dialog id="wasteFormDialog">
    <div class="dialog-head"><h2>新建危废容器</h2><button class="btn small" data-close="wasteFormDialog" type="button">关闭</button></div>
    <form id="wasteForm" class="form-grid">
      <div class="field"><label for="wasteName">危废名称</label><input id="wasteName" required placeholder="酸性无机废液"></div>
      <div class="field"><label for="wasteCategoryCode">国家危险废物类别/代码</label><input id="wasteCategoryCode" required placeholder="HW49 / 900-047-49"></div>
      <div class="field"><label for="wasteCategoryName">类别名称</label><input id="wasteCategoryName"></div>
      <div class="field"><label for="wastePhysicalState">物理形态</label><select id="wastePhysicalState"><option value="liquid">液体</option><option value="solid">固体</option><option value="sludge">污泥</option><option value="mixed">混合</option><option value="gas">气体</option></select></div>
      <div class="field full"><span>危险特性</span><div id="wasteCharacteristics" class="checks"></div></div>
      <div class="field full"><label for="wasteComposition">主要成分</label><textarea id="wasteComposition" required></textarea></div>
      <div class="field"><label for="wasteQuantity">初始数量</label><input id="wasteQuantity" type="number" min="0" step="any" required></div>
      <div class="field"><label for="wasteUnit">单位</label><input id="wasteUnit" required placeholder="L、kg"></div>
      <div class="field"><label for="wastePackage">包装容器</label><input id="wastePackage" required placeholder="5L HDPE 废液桶"></div>
      <div class="field"><label for="wasteLocation">危废暂存库位</label><select id="wasteLocation" required></select></div>
      <div class="field full"><label for="wasteNote">备注</label><textarea id="wasteNote"></textarea></div>
      <div id="wasteFormStatus" class="status full"></div>
      <div class="dialog-actions full"><button class="btn primary" type="submit">创建并生成编号</button><button class="btn" data-close="wasteFormDialog" type="button">取消</button></div>
    </form>
  </dialog>

  <dialog id="wasteDetailDialog">
    <div class="dialog-head"><h2 id="wasteDetailTitle">危废详情</h2><button class="btn small" data-close="wasteDetailDialog" type="button">关闭</button></div>
    <div id="wasteDetailBody"></div>
  </dialog>

  <dialog id="wasteActionDialog">
    <div class="dialog-head"><h2 id="wasteActionTitle">危废操作</h2><button class="btn small" data-close="wasteActionDialog" type="button">关闭</button></div>
    <form id="wasteActionForm" class="form-grid">
      <input id="wasteActionId" type="hidden"><input id="wasteActionType" type="hidden">
      <section id="wasteAddFields" class="full"><div class="field"><label for="wasteAddQuantity">增加数量</label><input id="wasteAddQuantity" type="number" min="0" step="any"></div></section>
      <section id="wasteTransferFields" class="full form-grid" hidden>
        <div class="field"><label for="manifestNo">国家系统电子联单编号</label><input id="manifestNo"></div>
        <div class="field"><label for="manifestRef">国家系统记录引用</label><input id="manifestRef"></div>
        <div class="field"><label for="transferDate">转移日期</label><input id="transferDate" type="date"></div>
        <div class="field"><label for="transporterName">承运单位</label><input id="transporterName"></div>
        <div class="field"><label for="transporterLicense">承运资质编号</label><input id="transporterLicense"></div>
        <div class="field"><label for="vehicleNo">车辆号牌</label><input id="vehicleNo"></div>
        <div class="field"><label for="recipientName">接收/处置单位</label><input id="recipientName"></div>
        <div class="field"><label for="recipientPermit">危废经营许可证编号</label><input id="recipientPermit"></div>
        <div class="field full"><label for="disposalMethod">利用/处置方式</label><input id="disposalMethod"></div>
      </section>
      <div id="wasteActionStatus" class="status full"></div>
      <div class="dialog-actions full"><button class="btn primary" type="submit">确认</button><button class="btn" data-close="wasteActionDialog" type="button">取消</button></div>
    </form>
  </dialog>

  <script src="/static/primary-navigation.js"></script>
  <script src="/static/account-menu.js"></script>
  <script src="/static/hazardous-waste.js"></script>
</body>
</html>
