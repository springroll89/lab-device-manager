<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <link rel="icon" href="data:,">
  <title>修改密码 · 实验室管理系统</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/puricore-theme.css">
</head>
<body class="page-password">
  <main class="password-shell">
    <section class="password-brand">
      <img src="/static/logo.png" alt="Puricore">
      <h1>修改登录密码</h1>
      <p id="passwordIntro">正在读取账号信息…</p>
    </section>
    <form id="passwordForm" class="password-card" novalidate>
      <div class="account-summary">
        <span>当前账号</span>
        <strong id="currentAccount">正在读取…</strong>
      </div>
      <div id="passwordStatus" class="form-status hidden" role="status" aria-live="polite"></div>
      <label class="account-field">
        <span>当前密码</span>
        <input id="currentPassword" type="password" autocomplete="current-password" required>
      </label>
      <label class="account-field">
        <span>新密码</span>
        <input id="newPassword" type="password" autocomplete="new-password" required>
        <small>至少 8 位，同时包含字母和数字。</small>
      </label>
      <label class="account-field">
        <span>再次输入新密码</span>
        <input id="confirmPassword" type="password" autocomplete="new-password" required>
      </label>
      <button id="passwordSubmit" class="account-primary" type="submit">保存新密码</button>
      <button id="passwordLogout" class="account-link-button" type="button">退出当前账号</button>
    </form>
  </main>
  <script src="/static/change-password.js"></script>
</body>
</html>
