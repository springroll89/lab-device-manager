<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>粘度测量工位</title>
  <script src="/static/theme.js"></script>
  <link rel="stylesheet" href="/static/puricore-theme.css">
  <style>
    body{margin:0;background:var(--pc-bg);color:var(--pc-text);font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}
    header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 28px;border-bottom:1px solid var(--pc-line);background:var(--pc-header-bg);backdrop-filter:blur(16px)}
    main{width:min(1100px,100%);margin:auto;padding:28px 18px}
    .toolbar,.cards{display:flex;gap:12px;flex-wrap:wrap}.cards{margin-top:22px}
    button,.toolbar a{min-height:46px;padding:11px 18px;border-radius:12px;border:1px solid var(--pc-line);background:var(--pc-surface-2);color:var(--pc-text);text-decoration:none}
    .primary{background:var(--pc-accent);color:var(--pc-on-accent);border:0;font-weight:700}
    .card{flex:1 1 290px;padding:18px;border:1px solid var(--pc-line);border-radius:16px;background:var(--pc-surface)}
    .muted{color:var(--pc-muted)}.ok{color:var(--pc-accent)}.busy{color:var(--pc-amber)}
    dialog{width:min(680px,calc(100% - 24px));border:1px solid var(--pc-line);border-radius:18px;background:var(--pc-surface);color:var(--pc-text);padding:20px}
    video{width:100%;min-height:280px;background:#020709;border-radius:14px;object-fit:cover}
    input{width:100%;margin-top:12px;padding:13px;border-radius:10px;border:1px solid var(--pc-line);background:var(--pc-input);color:var(--pc-text)}
  </style>
</head>
<body class="page-measurement-station">
  <header>
    <strong>粘度测量工位</strong>
    <div class="header-account-group">
      <nav data-primary-nav></nav>
      <span data-account-menu></span>
    </div>
  </header>
  <main>
    <p class="muted">先扫描样品标签，系统确认批次后锁定粘度计，避免读数进入错误批次。</p>
    <div class="toolbar">
      <button id="stationScan" class="primary" type="button">扫描待测样品</button>
      <button id="stationRefresh" type="button">刷新队列</button>
    </div>
    <div id="stationStatus" class="muted" style="margin-top:18px"></div>
    <div id="stationCards" class="cards"></div>
  </main>
  <dialog id="cameraScanDialog">
    <h2>扫描样品标签</h2>
    <p id="cameraScanStatus" class="muted"></p>
    <video id="cameraScanVideo" playsinline muted></video>
    <input id="cameraScanManual" placeholder="扫码枪或手工输入">
    <div class="toolbar" style="margin-top:12px">
      <button id="cameraScanManualSubmit" class="primary" type="button">确认编号</button>
      <button id="cameraScanClose" type="button">关闭</button>
    </div>
  </dialog>
  <script src="/static/primary-navigation.js"></script>
  <script src="/static/account-menu.js"></script>
  <script src="/static/scanner.js"></script>
  <script src="/static/measurement-station.js"></script>
</body>
</html>
