db_path            = "./data/lab_device_manager.db"
sample_interval_ms = 1000
web_port           = 7800
web_host           = "0.0.0.0"
# 推荐配置为固定、受信任的 HTTPS 地址，用于标签二维码和移动端摄像头。
public_base_url     = ""
tls_certfile       = ""
tls_keyfile        = ""
auto_open_browser  = true
# secret_key is auto-generated in data/.session_secret if omitted.

[topology]
collector_name = "后台 Mac 采集服务"
switch_name    = "实验室网络汇聚"
switch_model   = "UT-6408"

[[devices]]
name        = "pump-1"
type        = "tyd02"
alias       = "注射泵"
transport   = "tcp"
host        = "192.168.1.125"
tcp_port    = 4002                # UT-6804 串口 2
gateway_name = "UT-6804-01"
gateway_model = "UT-6804"
gateway_port = 2
baudrate    = 9600
parity      = "EVEN"        # 8E1
modbus_addr = 1
wordorder   = "CDAB"

# ── 粘度计（方瑞，RS232，自定义二进制协议）──
# 已接到 UT-6804 串口 1；抓到实机帧后继续确认校验和、扭矩换算和帧类型。
[[devices]]
name        = "viscometer-1"
type        = "viscometer"
alias       = "粘度计"
transport   = "tcp"
host        = "192.168.1.125"
tcp_port    = 4001                # UT-6804 串口 1
gateway_name = "UT-6804-01"
gateway_model = "UT-6804"
gateway_port = 1
baudrate    = 9600
parity      = "NONE"        # 8N1（粘度计假设）

# ── 搅拌器（HMS-C，RS485）×5 ──
# 搅拌器 1 已接到 UT-6804 串口 3；其余设备仍保留占位配置，接入后逐台改为对应 TCP 端口。
[[devices]]
name        = "stirrer-1"
type        = "stirrer"
alias       = "搅拌器1"
transport   = "tcp"
host        = "192.168.1.125"
tcp_port    = 4003                # UT-6804 串口 3
gateway_name = "UT-6804-01"
gateway_model = "UT-6804"
gateway_port = 3
baudrate    = 9600
parity      = "NONE"
modbus_addr = 1

[[devices]]
name        = "stirrer-2"
type        = "stirrer"
alias       = "搅拌器2"
serial_port = "/dev/cu.usbserial-STIR2"
baudrate    = 9600
parity      = "NONE"
modbus_addr = 2

[[devices]]
name        = "stirrer-3"
type        = "stirrer"
alias       = "搅拌器3"
serial_port = "/dev/cu.usbserial-STIR3"
baudrate    = 9600
parity      = "NONE"
modbus_addr = 3

[[devices]]
name        = "stirrer-4"
type        = "stirrer"
alias       = "搅拌器4"
serial_port = "/dev/cu.usbserial-STIR4"
baudrate    = 9600
parity      = "NONE"
modbus_addr = 4

[[devices]]
name        = "stirrer-5"
type        = "stirrer"
alias       = "搅拌器5"
serial_port = "/dev/cu.usbserial-STIR5"
baudrate    = 9600
parity      = "NONE"
modbus_addr = 5

# ── 温湿度控制器（WHD46-33，RS485 Modbus RTU）──
# 支持3路温湿度采集，串口参数：9600, NONE, 8N1
[[devices]]
name        = "sensor-1"
type        = "whd46"
alias       = "温湿度控制器"
serial_port = "/dev/cu.usbserial-WHD46"   # Windows上改为 COM5 等实际端口
baudrate    = 9600
parity      = "NONE"
modbus_addr = 1
